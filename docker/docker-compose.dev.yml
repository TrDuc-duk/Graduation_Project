# Môi trường dev: chỉ db + api (tự nạp lại khi sửa code). Frontend chạy bằng Vite (npm run dev),
# proxy /api tới localhost:8000. Chạy: cd docker && docker compose -f docker-compose.dev.yml up
name: aqi-dev

services:
  db:
    extends: {file: docker-compose.yml, service: db}
    ports: ["127.0.0.1:5432:5432"]       # mở cho công cụ DB trên máy dev

  api:
    extends: {file: docker-compose.yml, service: api}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      ENABLE_API_DOCS: "true"
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]   # đổi API_PORT nếu cổng 8000 đã bận
    volumes:
      - ../backend:/app
      - ../ml/ml_xgb/src:/opt/aqi_ml/src:ro
    depends_on:
      db: {condition: service_healthy}

volumes:
  pg_data:
