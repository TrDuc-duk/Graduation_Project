# Môi trường dev: db + api (tự nạp lại code) + frontend (bản build qua Nginx).
# Chạy: cd docker && docker compose -f docker-compose.dev.yml up -d --build
name: aqi-dev

services:
  db:
    extends: {file: docker-compose.yml, service: db}
    ports: ["127.0.0.1:5432:5432"]       # mở cho công cụ DB trên máy dev

  api:
    extends: {file: docker-compose.yml, service: api}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      ENABLE_API_DOCS: "true"
      ENABLE_DEV_ENDPOINTS: "true"        # API chỉ đọc /api/v1/dev/* cho dashboard demo (xem cả node pending)
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]   # đổi API_PORT nếu cổng 8000 đã bận
    volumes:
      - ../backend:/app
      - ../ml/ml_xgb/src:/opt/aqi_ml/src:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s

  frontend:
    build: {context: .., dockerfile: docker/nginx/Dockerfile}
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:80"]
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    restart: unless-stopped

  # Cầu nối Xiaozhi (09-xiaozhi-mcp). Chỉ chạy khi bật: docker compose -f docker-compose.dev.yml --profile xiaozhi up -d
  # Cần MCP_ENDPOINT (console Xiaozhi) và ASSISTANT_TOKEN (cùng giá trị cho api và bridge) trong docker/.env.
  xiaozhi-bridge:
    extends: {file: docker-compose.yml, service: xiaozhi-bridge}
    depends_on:
      api: {condition: service_healthy}

volumes:
  pg_data:
