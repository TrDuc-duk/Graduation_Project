# Cấu hình cấp main. Khối events chỉ được đặt ở đây (R25); các server nằm trong conf.d/default.conf.
user nginx;
worker_processes auto;

events {
    worker_connections 4096;    # đủ chỗ cho kết nối SSE (backend_design 14.2)
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # DNS nội bộ của Docker: tên "api" được tra lúc có request,
    # nên Nginx vẫn chạy khi api chưa lên hoặc đang khởi động lại.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
