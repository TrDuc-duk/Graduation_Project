# Các server của hệ thống AQI. Dùng được với mọi domain (server_name _), kể cả demo LAN bằng IP.

# Cổng 80: chỉ phục vụ xác minh Let's Encrypt, còn lại chuyển sang HTTPS (firmware luôn dùng HTTPS).
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Chứng chỉ do container certbot đặt vào (tự ký tạm hoặc Let's Encrypt)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Header bảo mật (backend_design 14.4). Không dùng add_header trong location con,
    # vì khi đó các header ở đây sẽ không được áp dụng cho location đó.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; worker-src 'self' blob:; frame-ancestors 'self'" always;

    # ---- Backend ----
    set $api http://api:8000;            # tra tên lúc có request (resolver ở nginx.conf)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # ghi đè, không nối giá trị client tự gửi
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass $api;
        proxy_read_timeout 60s;          # đủ cho xuất CSV dạng stream
    }

    # API trợ lý chỉ dành cho xiaozhi-bridge trong mạng Docker
    location /api/v1/assistant/ {
        return 404;
    }

    # SSE: không đệm, giữ kết nối lâu (backend_design 11.6)
    location /api/v1/stream/ {
        proxy_pass $api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Upload CSV để thử model (tối đa 5 MB)
    location = /api/v1/admin/forecast/predict-csv {
        client_max_body_size 6m;
        proxy_pass $api;
    }

    # ---- Frontend (React SPA) ----
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # File do Vite build có mã băm trong tên nên cache lâu được
    location /assets/ {
        expires 1y;
    }

    # index.html luôn lấy bản mới để nhận bản build mới
    location = /index.html {
        expires -1;
    }
}
