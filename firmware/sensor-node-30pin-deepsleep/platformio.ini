; PlatformIO Configuration - Air Quality Sensor Node (Deep-Sleep)
; Board: ESP32 DOIT DevKit V1 (30 chân) + LoRa AS32-TTL-100 + PMS7003 + CCS811 + AHT10
; Kiến trúc: setup() → đo → gửi LoRa → esp_deep_sleep()

; ===== Common Config =====
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0

; ===== FIRMWARE CHÍNH =====
[env:esp32doit-devkit-v1]
lib_deps =
    fu-hsi/PMS Library@^1.1.0
    adafruit/Adafruit CCS811 Library@^1.1.3
    adafruit/Adafruit AHTX0@^2.0.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.4.1
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
