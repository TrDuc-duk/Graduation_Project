; PlatformIO Configuration - Air Quality Sensor Node (FreeRTOS)
; Board: ESP32 DevKit V1 + LoRa AS32-TTL-100 + PMS7003 + CCS811 + DHT22

; ===== Common Config (chỉ platform/board/flags, KHÔNG có lib_deps) =====
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0

; ===== FIRMWARE CHÍNH =====
[env:esp32dev]
lib_deps =
    fu-hsi/PMS Library@^1.1.0
    adafruit/Adafruit CCS811 Library@^1.1.3
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.4.1
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5

; ===== HARDWARE COMPONENT TESTS =====
; Flash riêng lẻ: pio run -e test_xxx -t upload && pio device monitor

[env:test_dht22]
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
src_filter = -<*> +<../test/test_dht22.cpp> +<drivers/dht22.cpp>

[env:test_ccs811]
lib_deps =
    adafruit/Adafruit CCS811 Library@^1.1.3
src_filter = -<*> +<../test/test_ccs811.cpp> +<drivers/ccs811.cpp>

[env:test_pms7003]
lib_deps =
    fu-hsi/PMS Library@^1.1.0
src_filter = -<*> +<../test/test_pms7003.cpp> +<drivers/pms7003.cpp>

[env:test_lora]
lib_deps =
src_filter = -<*> +<../test/test_lora.cpp> +<drivers/lora_radio.cpp>

[env:test_battery]
lib_deps =
src_filter = -<*> +<../test/test_battery.cpp> +<drivers/battery_adc.cpp>
