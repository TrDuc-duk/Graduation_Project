; PlatformIO Configuration - Air Quality Gateway (Superloop)
; Board: ESP32 DevKit V1 + LoRa AS32-TTL-100 + WiFi

; ===== Common Config =====
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0

; ===== FIRMWARE CHÍNH =====
[env:esp32dev]
lib_deps =
    bblanchon/ArduinoJson@^7.4.1
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

; ===== HARDWARE COMPONENT TESTS =====

[env:test_wifi]
lib_deps =
src_filter = -<*> +<../test/test_wifi.cpp>

[env:test_lora_rx]
lib_deps =
src_filter = -<*> +<../test/test_lora_rx.cpp>

[env:test_http]
lib_deps =
    bblanchon/ArduinoJson@^7.4.1
src_filter = -<*> +<../test/test_http.cpp>
